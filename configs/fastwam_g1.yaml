# G1 model-only configuration, compatible with fastwam.runtime.create_fastwam.
# No LIBERO/RoboTwin dataset dependency. Training/data config is intentionally deferred.
# Action: 29 absolute joint angles + left/right hands (1 each) + root roll/pitch/yaw-rate.
# Order and hand sizes: action_space.json; update BOTH action_dim values when sizes change.
# Proprioception: 29 measured joint angles in MuJoCo order.
# load_text_encoder=false requires precomputed context/context_mask for inference.
# Action horizon is an infer_action argument: use 50 at 50 Hz for the initial demo.
# SONIC v1.1 needs 46 remaining frames per tick; hands bypass its encoder.
# Checkpoint path below is relative to the sibling FastWAM repository.
# G1 input/output projections are untrained; this YAML is not a trained policy.

_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: 29
redirect_common_files: true
mot_checkpoint_mixed_attn: false
compile_training_denoise: false
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: false
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: 34
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: 34
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: false

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 1.0
  infer_shift: 1.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
